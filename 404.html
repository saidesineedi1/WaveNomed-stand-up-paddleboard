<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found | Silver Hoof Stables</title>
  <meta name="description"
    content="The pathway you are seeking has wandered off the trail. Return to Silver Hoof Stables home for premier equestrian lessons, trail rides, and stabling.">

  <link rel="icon" type="image/jpeg" href="favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap"
    rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="404.css">
</head>

<body>

<button class="err-theme-btn" id="err-theme-toggle" title="Toggle Theme" aria-label="Toggle Theme">
    <i class="fa-solid fa-moon" id="err-theme-icon"></i>
  </button>

<main class="error-fullpage">
    <section class="error-page-section">
      <div class="error-page-content">

<div class="error-visual-wrap" aria-label="404 Error Graphic">
          <span class="error-digit">4</span>
          <div class="error-medallion-zero">
            <i class="fa-solid fa-horse-head"></i>
          </div>
          <span class="error-digit">4</span>
        </div>

<div class="error-floor-shadow"></div>

<div class="error-card">
          
          <div class="error-badge">
            <i class="fa-solid fa-compass"></i> LOST IN THE EQUESTRIAN TRAILS
          </div>

<h1 class="error-card-title">This Pathway Has Wandered Off The Trail</h1>

<p class="error-card-desc">
            The page you are seeking may have galloped elsewhere, expired, or never existed. Let us guide you back to our
            premier riding stables and training arenas.
          </p>

<div class="error-actions-group">
            <a href="index.html" class="error-btn-primary">
              <i class="fa-solid fa-house-chimney"></i> Back to Stables
            </a>
          </div>
        </div>

      </div>
    </section>
  </main>

<script>
    (function () {
      const html = document.documentElement;
      const btn = document.getElementById('err-theme-toggle');
      const icon = document.getElementById('err-theme-icon');
      const saved = localStorage.getItem('theme');
      if (saved) {
        html.setAttribute('data-theme', saved);
      }

      function syncIcon() {
        const isDark = html.getAttribute('data-theme') === 'dark';
        icon.className = isDark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
      }

      syncIcon();

      btn.addEventListener('click', function () {
        const current = html.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        syncIcon();
      });
    })();
  </script>

</body>

</html>
