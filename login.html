<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Back - Rider Login | Silver Hoof Stables</title>
  <meta name="description"
    content="Log in to your Silver Hoof Stables rider account to manage lesson schedules, view instructor notes, and track trail bookings.">

  <link rel="icon" type="image/jpeg" href="favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="login.css">
</head>

<body class="auth-page-body">

<div class="auth-nav-controls">
    <button class="nav-control-pill" id="rtl-toggle" title="Toggle Layout Direction (LTR / RTL)">
      RTL
    </button>
    <button class="nav-control-pill" id="theme-toggle" title="Toggle Theme (Dark / Light)">
      <i class="fa-solid fa-moon" id="theme-icon"></i>
    </button>
  </div>

<main class="auth-wrapper">
    <div class="auth-card-container">

<div class="auth-hero-col" style="background-image: url('images/hero2_ranch_sunset.jpg');">
        <div class="hero-overlay-gradient"></div>
        
        <div class="hero-card-bottom">
          <div class="hero-pill-badge">
            <i class="fa-solid fa-sparkles"></i> Pure Equestrian Care
          </div>
          <p class="hero-quote-text">
            "Nurture your connection with majestic horses, trained with passion and care."
          </p>
        </div>
      </div>

<div class="auth-form-col">
        <div class="auth-form-content">

<a href="index.html" class="brand-logo auth-brand-link" title="Silver Hoof Stables - Home">
            <div class="logo-icon">
              <img src="images/logo.png" alt="Silver Hoof Stables Logo" class="brand-logo-img">
            </div>
            <div class="brand-text">
              <span class="brand-name">SILVER HOOF</span>
              <span class="brand-sub">STABLES</span>
            </div>
          </a>

<div class="auth-header-text text-center">
            <h1 class="auth-heading">Welcome Back</h1>
            <p class="auth-subheading">Sign in to manage your rider portal, lessons, and bookings</p>
          </div>

<form id="login-page-form" onsubmit="handleLoginPageSubmit(event)" novalidate>
            
            <div class="form-field-group">
              <label for="login-email">Email Address</label>
              <div class="input-pill-wrap">
                <i class="fa-regular fa-envelope field-left-icon"></i>
                <input type="email" id="login-email" placeholder="Enter your email" required>
              </div>
            </div>

            <div class="form-field-group">
              <label for="login-password">Password</label>
              <div class="input-pill-wrap">
                <i class="fa-regular fa-lock field-left-icon"></i>
                <input type="password" id="login-password" placeholder="Enter your password" required>
                <i class="fa-regular fa-eye field-right-icon" id="toggle-pass-btn" onclick="togglePasswordVisibility('login-password', this)"></i>
              </div>
            </div>

            <div class="form-options-row">
              <label class="remember-checkbox-wrap">
                <input type="checkbox" id="remember-me" checked>
                <span>Remember me</span>
              </label>
              <a href="#" onclick="alert('Password reset instructions sent to your email.'); return false;" class="forgot-pass-link">Forgot?</a>
            </div>

            <button type="submit" class="auth-submit-btn">
              Sign In to Your Portal <i class="fa-solid fa-arrow-right"></i>
            </button>

          </form>

<div class="auth-divider-line">
            <span>OR CONTINUE WITH</span>
          </div>

<div class="social-auth-row">
            <button type="button" class="social-auth-pill" onclick="handleSocialAuth('Google')">
              <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo" class="google-svg-icon">
              <span>Google</span>
            </button>
            
            <button type="button" class="social-auth-pill" onclick="handleSocialAuth('Apple')">
              <i class="fa-brands fa-apple apple-icon"></i>
              <span>Apple</span>
            </button>
          </div>

<div class="auth-footer-switch text-center">
            <p>New to Silver Hoof Stables? <a href="signup.html" class="switch-link">Create an Account</a></p>
          </div>

        </div>
      </div>

    </div>
  </main>

<script src="index.js"></script>
  <script src="login.js"></script>
</body>

</html>
